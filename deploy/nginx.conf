server {
	listen 80;
	listen [::]:80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;
	charset utf-8;

	gzip on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_types
		text/plain
		text/css
		text/xml
		application/javascript
		application/json
		application/manifest+json
		application/wasm
		image/svg+xml;

	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;

	location = /healthz {
		access_log off;
		add_header Content-Type text/plain;
		return 200 "ok\n";
	}

	# Hashed build assets never change: cache them aggressively.
	location /_app/immutable/ {
		expires 1y;
		try_files $uri =404;
	}

	# The app shell must revalidate, so a deploy is picked up on the next load.
	location = /index.html {
		add_header X-Content-Type-Options "nosniff" always;
		add_header X-Frame-Options "SAMEORIGIN" always;
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;
		add_header Cache-Control "no-cache" always;
		try_files $uri =404;
	}

	# Everything else falls back to the static app shell.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
