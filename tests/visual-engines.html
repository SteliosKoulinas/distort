<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>Distort — GPU regression tests</title>
<body>
<h1>Visual-engine pixel tests</h1>
<pre id="result">Running…</pre>
<script type="module">
	import { runVisualEngineTests } from './visual-engines.ts';
	window.testPromise = (async () => {
		try {
			const result = await runVisualEngineTests();
			document.querySelector('#result').textContent = JSON.stringify(result, null, 2);
			document.body.dataset.result = 'passed';
			return result;
		} catch (error) {
			document.querySelector('#result').textContent = error.stack;
			document.body.dataset.result = 'failed';
			return { error: String(error.stack) };
		}
	})();
</script>
</body>
</html>
